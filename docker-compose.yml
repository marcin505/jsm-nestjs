services:
  # 1. Your NestJS Application
  api:
    build: .
    container_name: nest_api
    ports:
      - '3000:3000' # Exposes NestJS on port 3000 to the outside world
    environment:
      DATABASE_URL: ${DATABASE_URL} # Automatically reads connection string from your local .env
    depends_on:
      postgres:
        condition: service_healthy # NestJS container waits until PostgreSQL is 100% active and healthy

  # 2. Your PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: nest_postgres
    environment:
      POSTGRES_USER: ${DB_USER} # Reads database admin user from .env
      POSTGRES_PASSWORD: ${DB_PASSWORD} # Reads database admin password from .env
      POSTGRES_DB: ${DB_NAME} # Reads database name from .env
    ports:
      - '5432:5432' # Exposes PostgreSQL on the standard port
    volumes:
      - postgres_data:/var/lib/postgresql/data # Permanently stores database records so they don't vanish on container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"] # Internal script verifying PostgreSQL readiness
      interval: 5s
      timeout: 5s
      retries: 5
 # 3. Prisma Studio as container
  studio:
    image: node:22-alpine
    container_name: prisma_studio
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - '5555:5555' # Wystawia Prisma Studio na porcie 5555
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: npx prisma studio --port 5555 --browser none
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: # Declares the named volume for database persistence
