services:
  # 1. Your NestJS Application
  api:
    build: .
    container_name: nest_api
    ports:
      - '3000:3000' # Exposes NestJS on port 3000 to the outside world
    env_file:
      - .env # Wskazuje plik źródłowy zmiennych
    environment:
      - DATABASE_URL # Docker automatycznie pobierze prawidłową wartość z pliku .env i wstrzyknie ją do kontenera
    depends_on:
      postgres:
        condition: service_healthy # NestJS container waits until PostgreSQL is 100% active and healthy

  # 2. Your PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: nest_postgres
    env_file:
      - .env # Dodane również tutaj, aby baza mogła odczytać DB_USER, DB_PASSWORD i DB_NAME
    environment:
      POSTGRES_USER: ${DB_USER} # Reads database admin user from .env
      POSTGRES_PASSWORD: ${DB_PASSWORD} # Reads database admin password from .env
      POSTGRES_DB: ${DB_NAME} # Reads database name from .env
    ports:
      - '5432:5432' # Exposes PostgreSQL on the standard port
    volumes:
      - postgres_data:/var/lib/postgresql/data # Permanently stores database records so they don't vanish on container restarts
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Prisma Studio as container
  studio:
    image: node:22-alpine
    container_name: prisma_studio
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - '5555:5555' # Wystawia Prisma Studio na porcie 5555
    env_file:
      - .env
    environment:
      - DATABASE_URL # Bezpieczne pobranie zmiennej tak samo jak w usłudze api
    command: npx prisma studio --port 5555 --browser none
    depends_on:
      postgres:
        condition: service_healthy
  # 4. Custom MCP Server for AI Agents
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: nest_mcp_server
    command: tail -f /dev/null # <--- Zmusza kontener do bezczynnego stania w tle
    env_file:
      - .env
    environment:
      # Wewnątrz sieci Dockera łączymy się z kontenerem bazy danych, używając jego nazwy: 'postgres'
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
    restart: always
    depends_on:
      postgres:
        condition: service_healthy 
  kafka:
    image: apache/kafka:3.7.0
    container_name: nest_kafka
    ports:
      - "9092:9092"
    # OTO SYSTEMOWE WYMUSZENIE UTWORZENIA TEMATÓW (W JEDNEJ LINII):
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 # Zmienione na localhost dla skryptu inicjalizacji
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_INTER_BROKER_PROTOCOL_VERSION=3.5
      - KAFKA_LOG_MESSAGE_FORMAT_VERSION=3.5
      - KAFKA_METADATA_LOG_VERSION=3.5
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1


volumes:
  postgres_data:
